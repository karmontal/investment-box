# Two services sharing one data volume: the engine and the dashboard.
#
# They are separate containers on purpose. The dashboard restarting must not
# interrupt the engine, and an engine crash must not take away the view you
# need to see why.
#
# Secrets come from .env, which is gitignored and never baked into the image.

services:
  engine:
    build:
      context: .
      args:
        # Stamps the image so the dashboard can show which build it is running.
        # Optional: export GIT_COMMIT=$(git rev-parse --short HEAD) before
        # building, or leave it and the sidebar says "unknown".
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: investment-box:latest
    container_name: investment-box-engine
    command: ["python", "scripts/run_engine.py"]
    env_file: [.env]
    environment:
      IB__DATA_DIR: /data
      IB__LOG_LEVEL: INFO
      TZ: Asia/Jerusalem
    volumes:
      - investment-data:/data
      # Mounted read-only: the engine reads config and must never rewrite it.
      - ./config:/app/config:ro
    restart: unless-stopped
    # tini as PID 1: forwards signals and reaps zombies. The engine installs its
    # own SIGTERM handler, so this is belt-and-braces rather than the fix --
    # but PID 1 semantics are subtle enough to deserve both.
    init: true
    stop_grace_period: 30s
    healthcheck:
      # Builds the service container, not just an import. A bare import passes
      # even when the process cannot write its data directory -- which is
      # exactly the failure this check exists to catch.
      test: ["CMD", "python", "-c",
             "from investment_box.services.container import build_services; build_services(configure_logs=False)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  dashboard:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: investment-box:latest
    container_name: investment-box-dashboard
    command:
      - streamlit
      - run
      - src/investment_box/ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    env_file: [.env]
    environment:
      IB__DATA_DIR: /data
      TZ: Asia/Jerusalem
    ports:
      # The bind address is configurable for exactly one reason: to pin the
      # dashboard to a private VPN interface. The default is loopback and must
      # stay that way.
      #
      # This page has a kill switch, shows your balances and positions, and
      # edits autonomy level and allocated capital. It has NO login screen of
      # any kind -- the network boundary IS the authentication.
      #
      # Tailscale: put IB_DASHBOARD_BIND=100.x.y.z in .env, taking the address
      # from `tailscale ip -4` ON THIS HOST. Never set it to 0.0.0.0, and never
      # to the public IP. Publishing a port also writes Docker's own iptables
      # rules AHEAD of ufw's, so an exposed dashboard stays reachable even
      # though `ufw status` insists the port is denied.
      - "${IB_DASHBOARD_BIND:-127.0.0.1}:8501:8501"
    volumes:
      - investment-data:/data
      - ./config:/app/config:ro
    depends_on: [engine]
    restart: unless-stopped
    healthcheck:
      # Streamlit's own endpoint answers 200 even when the app script raises,
      # so check that the services build too.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health'); from investment_box.services.container import build_services; build_services(configure_logs=False)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

volumes:
  investment-data:
    driver: local
